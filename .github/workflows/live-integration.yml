name: Live Integration (manual)

# The app + proxy dependent live tests (`tests/unit/app/test_costs_budget.py`,
# `tests/test_tool_audit_log_live.py`, `tests/test_tool_permissions_api_live.py`)
# are NOT green yet — they have pre-existing expectation / shared-state issues
# that need a dedicated pass. They are kept manual and non-blocking so they stay
# reproducible without turning the PR gate red. Flip `continue-on-error` to
# false once `scripts/run_live_integration.py --with-proxy` is green.
#
# The self-contained plugin E2E path is gated separately and blocking in
# comprehensive-testing.yml (`integration-plugin-e2e`).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Set up Node (the plugin hooks are JS subprocesses)
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]
        pip install -e .[app]

    - name: Run live integration suite (app + proxy)
      run: python scripts/run_live_integration.py --with-proxy
