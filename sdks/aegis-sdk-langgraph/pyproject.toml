[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-sdk-langgraph"
version = "0.1.0"
description = "Aegis tool-call permissions, leak detection and audit for LangGraph agents."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Aegis" }]
keywords = ["security", "langgraph", "agents", "guardrails", "audit"]
dependencies = ["ai-aegis[app]>=1.0.0"]

[project.urls]
Homepage = "https://gitee.com/wan-xianghao/ai-aegis"

[project.optional-dependencies]
langgraph = ["langgraph>=1.0", "langchain>=1.0", "langchain-core>=1.0"]

[tool.setuptools]
packages = ["aegis_sdk_langgraph"]
